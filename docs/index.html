<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>CreaMente Digital</title>
  <meta name="description" content="Recorrido interactivo 360° sobre prevención de incendios de la cobertura vegetal en Boyacá.">
  <link rel="stylesheet" href="style.css">
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
</head>
<body data-estado="conservado" data-pantalla="inicio">

  <!-- Escena 360°. La foto de cada nodo se carga como cielo. -->
  <a-scene id="escena" embedded loading-screen="enabled: false"
           vr-mode-ui="enabled: true" device-orientation-permission-ui="enabled: true">
    <a-sky id="cielo" color="#ffffff" rotation="0 -90 0"></a-sky>
    <a-entity id="viajero">
      <a-entity camera look-controls="reverseMouseDrag: true" position="0 1.6 0"></a-entity>
    </a-entity>
    <a-entity light="type: ambient; intensity: 1.2"></a-entity>
    <a-entity light="type: directional; intensity: 0.9" position="2 4 3"></a-entity>
    <!-- Bus que cruza la escena al pasar de una parada a la siguiente -->
    <a-entity id="bus" visible="false"></a-entity>
    <!-- Interior del bus: se arma por código y solo se ve en los nodos que lo piden -->
    <a-entity id="interior" visible="false"></a-entity>
  </a-scene>
  <div id="bruma" aria-hidden="true"></div>

  <!-- Barra superior: recorrido, estado del territorio y lo que lleva el viajero -->
  <header id="barra" hidden>
    <ol id="ruta" aria-label="Recorrido"></ol>
    <div id="indicadores">
      <p id="estado" aria-live="polite"><span class="punto" aria-hidden="true"></span><span id="estado-nombre"></span></p>
      <ul id="mochila" aria-label="Lo que llevas"></ul>
    </div>
  </header>

  <!-- Controles para caminar por el pasillo del bus -->
  <div id="caminar" hidden>
    <button id="caminar-adelante" type="button">Caminar al fondo</button>
    <button id="caminar-atras" type="button">Volver a la entrada</button>
  </div>

  <!-- Tarjeta inferior: texto del nodo y opciones -->
  <main id="tarjeta" aria-live="polite">
    <p id="lugar"></p>
    <h1 id="titulo"></h1>
    <p id="texto"></p>
    <p id="pregunta"></p>
    <div id="opciones"></div>
    <p id="dato" hidden></p>
    <div id="acciones"></div>
  </main>

  <!-- Vista con la cámara del celular: el mismo estado sobre el entorno real -->
  <section id="camara" hidden aria-label="Vista con cámara">
    <video id="video" playsinline muted></video>
    <div id="camara-bruma" aria-hidden="true"></div>
    <p id="camara-estado"></p>
    <button id="camara-cerrar" type="button">Cerrar cámara</button>
  </section>

  <!-- Fuentes -->
  <dialog id="fuentes">
    <h2>Fuentes</h2>
    <ul id="fuentes-lista"></ul>
    <form method="dialog"><button type="submit">Cerrar</button></form>
  </dialog>

  <audio id="ambiente" loop preload="none"></audio>

  <script src="data/guion.js"></script>
  <script src="script.js"></script>
</body>
</html>
